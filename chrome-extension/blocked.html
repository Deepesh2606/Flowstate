<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stay in Flow — FLOWSTATE Shield</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(155deg, #1d263b 0%, #161d2f 100%);
        color: #f8fafc;
        font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        padding: 24px;
      }
      .shield-card {
        width: 100%;
        max-width: 440px;
        background: rgba(34, 43, 66, 0.9);
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 16px;
        padding: 36px 28px;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        box-shadow: 0 24px 54px rgba(10, 14, 28, 0.38);
      }
      .shield-kicker {
        font-size: 12px;
        font-weight: 600;
        color: #94a3b8;
        letter-spacing: 0.04em;
      }
      h1 {
        font-size: 26px;
        font-weight: 700;
        letter-spacing: -0.025em;
        color: #ffffff;
      }
      p {
        font-size: 14px;
        line-height: 1.55;
        color: #cbd5e1;
      }
      .countdown {
        font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 56px;
        font-weight: 700;
        letter-spacing: -0.04em;
        font-variant-numeric: tabular-nums;
        color: #ffffff;
        margin: 8px 0 4px;
      }
      .topic {
        font-size: 13px;
        color: #cbd5e1;
      }
      .actions {
        display: flex;
        gap: 10px;
        margin-top: 10px;
        width: 100%;
      }
      button {
        flex: 1;
        padding: 10px 16px;
        border-radius: 10px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }
      .btn-primary {
        border: none;
        background: #f8fafc;
        color: #161d2f;
      }
      .btn-primary:hover {
        background: #ffffff;
      }
      .btn-secondary {
        border: 1px solid rgba(255, 255, 255, 0.16);
        background: rgba(255, 255, 255, 0.06);
        color: #e2e8f0;
      }
      .btn-secondary:hover {
        background: rgba(255, 255, 255, 0.14);
        color: #ffffff;
      }
    </style>
  </head>
  <body>
    <main class="shield-card">
      <div class="shield-kicker">FLOWSTATE · Focus Shield</div>
      <h1>Stay locked in.</h1>
      <p>This site is paused while your focus sprint is active. Finish this block first, then take your break.</p>
      <div class="countdown" id="shield-countdown">--:--</div>
      <div class="topic" id="shield-topic">Deep Work Session</div>
      <div class="actions">
        <button id="btn-back-app" class="btn-primary" type="button">Return to FLOWSTATE</button>
        <button id="btn-pause-focus" class="btn-secondary" type="button">Pause Focus</button>
      </div>
    </main>
    <script src="blocked.js"></script>
  </body>
</html>
