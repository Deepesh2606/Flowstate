<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stay in Flow — FLOWSTATE Shield</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0b0d12;
        color: #f4f4f6;
        font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        padding: 24px;
      }
      .shield-card {
        width: 100%;
        max-width: 440px;
        background: #12151c;
        border: 1px solid #222631;
        border-radius: 12px;
        padding: 36px 28px;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
      }
      .shield-kicker {
        font-size: 12px;
        font-weight: 600;
        color: #8c94a6;
        letter-spacing: 0.04em;
      }
      h1 {
        font-size: 26px;
        font-weight: 700;
        letter-spacing: -0.025em;
        color: #ffffff;
      }
      p {
        font-size: 14px;
        line-height: 1.55;
        color: #9ba3b5;
      }
      .countdown {
        font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 56px;
        font-weight: 700;
        letter-spacing: -0.04em;
        font-variant-numeric: tabular-nums;
        color: #ffffff;
        margin: 8px 0 4px;
      }
      .topic {
        font-size: 13px;
        color: #c2c7d3;
      }
      .actions {
        display: flex;
        gap: 10px;
        margin-top: 10px;
        width: 100%;
      }
      button {
        flex: 1;
        padding: 10px 16px;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }
      .btn-primary {
        border: none;
        background: #f4f4f6;
        color: #0b0d12;
      }
      .btn-primary:hover {
        background: #ffffff;
      }
      .btn-secondary {
        border: 1px solid #262b38;
        background: #161a24;
        color: #c2c7d3;
      }
      .btn-secondary:hover {
        background: #1e2330;
        color: #ffffff;
      }
    </style>
  </head>
  <body>
    <main class="shield-card">
      <div class="shield-kicker">FLOWSTATE · Focus Shield</div>
      <h1>Stay locked in.</h1>
      <p>This site is paused while your focus sprint is active. Finish this block first, then take your break.</p>
      <div class="countdown" id="shield-countdown">--:--</div>
      <div class="topic" id="shield-topic">Deep Work Session</div>
      <div class="actions">
        <button id="btn-back-app" class="btn-primary" type="button">Return to FLOWSTATE</button>
        <button id="btn-pause-focus" class="btn-secondary" type="button">Pause Focus</button>
      </div>
    </main>
    <script src="blocked.js"></script>
  </body>
</html>
